name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build and Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=${JAVA_HOME}"
          VERSION_LINE=$(java -version 2>&1 | head -n 1)
          RAW_VER=$(printf '%s\n' "$VERSION_LINE" | sed -n 's/.*"\(.*\)".*/\1/p')
          if [ -z "$RAW_VER" ]; then
            echo "::error::Failed to detect active Java version from: $VERSION_LINE"
            exit 1
          fi
          MAJOR_VER=$(printf '%s' "$RAW_VER" | cut -d. -f1)
          if [ "$MAJOR_VER" = "1" ]; then
            MAJOR_VER=$(printf '%s' "$RAW_VER" | cut -d. -f2)
          fi
          if ! printf '%s' "$MAJOR_VER" | grep -qE '^[0-9]+$'; then
            echo "::error::Unable to parse active Java major version from: $RAW_VER"
            exit 1
          fi
          echo "Active Java major version: ${MAJOR_VER}"
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java ${MAJOR_VER}."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          KEYTOOL_BIN="keytool"
          if [ -n "${JAVA_HOME}" ] && [ -x "${JAVA_HOME}/bin/keytool" ]; then
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
          fi
          if [ ! -f "./debug.keystore" ]; then
            "$KEYTOOL_BIN" -genkeypair -noprompt \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Temporary ./debug.keystore could not be created."
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at ${EXPECTED_APK}"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::${EXPECTED_APK} is not a regular file."
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::${EXPECTED_APK} is empty."
            exit 1
          fi
          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "::error::${EXPECTED_APK} does not have a .apk extension."
              exit 1
              ;;
          esac
          echo "Verified debug APK: ${EXPECTED_APK}"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          ASSET_DIR="${RUNNER_TEMP}/apk-release-asset"
          mkdir -p "$ASSET_DIR"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO=$(printf '%s' "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g; s/-\{2,\}/-/g; s/^-//; s/-$//')
          if [ -z "$SAFE_REPO" ]; then
            SAFE_REPO="android-app"
          fi
          ASSET_FILENAME="${SAFE_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${ASSET_DIR}/${ASSET_FILENAME}"
          cp "$EXPECTED_APK" "$ASSET_PATH"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Failed to stage release asset at ${ASSET_PATH}."
            exit 1
          fi
          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_filename=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
        run: |
          gh --version
          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Prepared APK release asset is missing or empty."
            exit 1
          fi
          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "::error::Prepared release asset does not have a .apk extension."
              exit 1
              ;;
          esac
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES=$(cat <<EOF
          This is an automatically generated debug APK built by GitHub Actions.

          - Workflow run number: ${GITHUB_RUN_NUMBER}
          - Workflow run attempt: ${GITHUB_RUN_ATTEMPT}
          - Source commit SHA: ${GITHUB_SHA}
          - Purpose: Intended for testing only (not a Google Play Store production release)
          - Signing: Signed only with a temporary debug keystore
          EOF
          )
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "${GITHUB_SHA}" \
            --latest \
            --notes "$RELEASE_NOTES"

      - name: Report APK download result
        if: always() && steps.prepare_asset.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
          ASSET_FILENAME: ${{ steps.prepare_asset.outputs.asset_filename }}
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            gh release view "$RELEASE_TAG"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq .url)
            echo "Release tag: ${RELEASE_TAG}"
            echo "Release title: ${RELEASE_TITLE}"
            echo "Release URL: ${RELEASE_URL}"
            echo "APK asset filename: ${ASSET_FILENAME}"
            {
              echo "### Debug APK Release Published"
              echo ""
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **APK Asset:** \`${ASSET_FILENAME}\`"
              echo "- **Download Page:** ${RELEASE_URL}"
              echo ""
              echo "You can download \`${ASSET_FILENAME}\` directly from the release **Assets** section. The normal GitHub Actions artifact \`app-debug-apk\` is also available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed for tag ${RELEASE_TAG}. The debug APK build succeeded and the GitHub Actions artifact 'app-debug-apk' remains available."
            {
              echo "### Debug APK Build Succeeded (Release Publishing Failed)"
              echo ""
              echo "> **Warning:** Publishing the GitHub Release failed, but the debug APK build completed successfully."
              echo ""
              echo "- **Backup Actions Artifact:** \`app-debug-apk\` remains available in the workflow run artifacts."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
