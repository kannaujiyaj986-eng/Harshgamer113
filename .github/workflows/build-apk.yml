name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -alias androiddebugkey -storepass android -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Debug APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Stage Debug APK
        run: |
          mkdir -p release-apk
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Debug APK not found!"
            exit 1
          fi
          cp "$APK_PATH" release-apk/Harshgamer113-debug.apk
          ls -lh release-apk/Harshgamer113-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Harshgamer113-debug-apk
          path: release-apk/Harshgamer113-debug.apk
          if-no-files-found: error

      - name: Publish Debug APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-v1.0.${{ github.run_number }}
          name: Harshgamer113 Debug APK (Build #${{ github.run_number }})
          body: |
            Automated Debug APK build for commit `${{ github.sha }}`.

            Download **Harshgamer113-debug.apk** below to install directly on Android.
          files: release-apk/Harshgamer113-debug.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
